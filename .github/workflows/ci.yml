# CI(docs/06-cross-platform.md §5)。develop への PR と push で、Windows / macOS の両方を検証する。
name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # rustup 1.28 以降は rust-toolchain.toml のツールチェーンを自動インストールしないため、明示的に導入する
      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check version consistency
        run: node tools/check-version.mjs

      # アプリ内インストーラのマニフェストが versions.env から生成したものと一致しているか(docs/41。オフライン)
      - name: Check engine manifest
        run: node tools/gen-engine-manifest.mjs --check

      # フロントエンド
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Rust(依存は Cargo.lock のとおりに固定して検証する)
      - name: cargo fmt
        run: cargo fmt --check
        working-directory: src-tauri
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: src-tauri
      - name: cargo test
        run: cargo test --locked
        working-directory: src-tauri

      # ComfyUI 開発用スクリプトは、実行せず構文だけ検証する(GPU・巨大な依存が必要なため)
      - name: Check PowerShell scripts parse
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Check shell scripts syntax
        if: runner.os == 'macOS'
        run: |
          for f in tools/comfyui/*.sh; do bash -n "$f"; done

  # インストーラの生成は時間がかかるため、PR では行わず develop への push のときだけ実行する
  bundle:
    name: Installer (${{ matrix.os }})
    needs: check
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: gazooo-windows-installer
            path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: app,dmg
            artifact: gazooo-macos-installer
            path: src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      # Next.js の静的エクスポート → Rust のリリースビルド → インストーラ生成
      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
